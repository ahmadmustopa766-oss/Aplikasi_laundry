{% extends "base.html" %}
{% block title %}Login - Aplikasi Laundry{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Header Brand -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-900/60 border border-blue-700/50 flex items-center justify-center text-sky-300 shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Aplikasi Laundry</h1>
            <p class="text-sm text-slate-400 mt-1">Masuk untuk mengelola atau memantau laporan keuangan</p>
        </div>

        <!-- Card Form Login -->
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200/80 p-8">
            <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required autofocus
                           placeholder="Masukkan username"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required
                           placeholder="Masukkan password"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition">
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 rounded-lg bg-slate-900 hover:bg-blue-950 text-white font-semibold text-sm shadow-sm transition cursor-pointer">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
